# cargo audit config file
# https://github.com/rustsec/rustsec/blob/main/cargo-audit/audit.toml.example
#
# All of the options which can be passed via CLI arguments can also be
# permanently specified in this file.

[advisories]

# advisory IDs to ignore e.g. ["RUSTSEC-2019-0001", ...]
# RUSTSEC-2026-0258: h2 unbounded empty DATA frames (low severity DoS).
# Only patched in h2 >= 0.4.16, but actix-http 3.13.3 (latest) still
# requires h2 0.3.x / http 0.2.x, so this cannot be resolved via a
# normal dependency update. Tracking upstream actix-web's migration to
# http 1.0/h2 0.4 before this can be cleared.
# RUSTSEC-2026-0387: crypto-bigint timing variability in constant-time ops.
# Only patched in crypto-bigint >= 0.7.6, but it is pulled in transitively
# via aws-sigv4 -> p256 0.13 -> elliptic-curve 0.13 (requires ^0.5), and
# aws-sigv4 1.5.1 (latest) has no release on the newer RustCrypto stack.
# Used only for AWS SigV4 request signing. Remove once the AWS SDK upgrades.
ignore = ["RUSTSEC-2026-0258", "RUSTSEC-2026-0387"]

# warn for categories of informational advisories
informational_warnings = ["notice", "unmaintained", "unsound"]

# CVSS severity ("none", "low", "medium", "high", "critical")
severity_threshold = "none"

# Advisory Database Configuration
[database]
path = ".cargo/advisory-db"                        # Path where advisory git repo will be cloned
url = "https://github.com/RustSec/advisory-db.git" # URL to git repo
fetch = true                                       # Perform a `git fetch` before auditing (default: true)
stale = false                                      # Allow stale advisory DB (i.e. no commits for 90 days, default: false)

# Output Configuration
[output]
deny = ["warnings", "unmaintained", "unsound", "yanked"] # exit on error if these are found
format = "terminal"                                      # "terminal" (human readable report) or "json"
quiet = false                                            # Only print information on error
show_tree = true                                         # Show inverse dependency trees along with advisories (default: true)

[yanked]
enabled = true      # Warn for yanked crates in Cargo.lock (default: true)
update_index = true # Auto-update the crates.io index (default: true)
